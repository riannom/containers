services:
  app_proxy:
    environment:
      APP_HOST: $APP_CONTAINERS_BITCOIN_SIGNET_WEB_IP
      APP_PORT: 80

  signet_web:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    user: root
    restart: on-failure
    depends_on:
      - signet_server
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX_EOF'
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 80 default_server;
            server_name _;

            client_max_body_size 100M;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-App-Id "containers-bitcoin-signet" always;

            sub_filter_once on;
            sub_filter '</head>' '<style>.x-net-banner{position:sticky;top:0;z-index:2147483647;width:100%;padding:10px 16px;text-align:center;font-family:-apple-system,system-ui,sans-serif;font-weight:700;letter-spacing:2px;font-size:13px;box-sizing:border-box;background:#9333ea;color:#fff;}</style></head>';
            sub_filter '<body>' '<body><div class="x-net-banner">SIGNET — signed Bitcoin test network</div>';
            sub_filter '<title>' '<title>[SIGNET] ';

            location / {
                proxy_pass http://${APP_CONTAINERS_BITCOIN_SIGNET_NODE_IP}:3000;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$remote_addr;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_set_header Accept-Encoding "";
                proxy_read_timeout 1d;
            }
        }
        NGINX_EOF
        exec nginx -g 'daemon off;'
    networks:
      default:
        ipv4_address: $APP_CONTAINERS_BITCOIN_SIGNET_WEB_IP

  signet_init:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    user: root
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        DIR=/data/bitcoin/signet
        SENTINEL="$$DIR/.blockfilter-heal-v1"
        # One-time heal: an unclean shutdown can leave the basic block filter
        # index behind the chain tip, which Core v30 treats as fatal
        # ("Cannot read last block filter header; index may be corrupted") and
        # refuses to start. Delete only that index so bitcoind rebuilds it from
        # local blocks on next boot (fast on signet, no re-download of the
        # chain). Gated by a sentinel so it runs once per heal version, not on
        # every restart. Bump the sentinel suffix to re-trigger after a future
        # corruption event.
        if [ -d "$$DIR/indexes/blockfilter" ] && [ ! -f "$$SENTINEL" ]; then
          echo "[init] Clearing block filter index for one-time rebuild"
          rm -rf "$$DIR/indexes/blockfilter"
        fi
        mkdir -p "$$DIR"
        touch "$$SENTINEL" 2>/dev/null || true
        echo "[init] block filter index heal complete"

  signet_server:
    image: ghcr.io/getumbrel/umbrel-bitcoin:v1.2.2@sha256:bc72c7fe705c582b8be1740c52449ac82de4d40b0e91ea090513aac6d4fc9393
    restart: on-failure
    stop_grace_period: 15m30s
    depends_on:
      signet_init:
        condition: service_completed_successfully
    # exposed for external connections to bitcoind; dependent apps connect
    # directly to APP_CONTAINERS_BITCOIN_SIGNET_NODE_IP instead
    ports:
      - "${APP_CONTAINERS_BITCOIN_SIGNET_P2P_PORT}:${APP_CONTAINERS_BITCOIN_SIGNET_P2P_PORT}"
      - "${APP_CONTAINERS_BITCOIN_SIGNET_RPC_PORT}:${APP_CONTAINERS_BITCOIN_SIGNET_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DEFAULT_CHAIN: signet
      BITCOIND_EXTRA_ARGS: '-deprecatedrpc=create_bdb'
      APPS_SUBNET: "${NETWORK_IP}/16"
      P2P_PORT: "${APP_CONTAINERS_BITCOIN_SIGNET_P2P_PORT}"
      P2P_WHITEBIND_PORT: "8335"
      RPC_PORT: "${APP_CONTAINERS_BITCOIN_SIGNET_RPC_PORT}"
      TOR_PORT: "8334"
      ZMQ_RAWBLOCK_PORT: "28332"
      ZMQ_RAWTX_PORT: "28333"
      ZMQ_HASHBLOCK_PORT: "28334"
      ZMQ_SEQUENCE_PORT: "28335"
      ZMQ_HASHTX_PORT: "28336"
      TOR_HOST: "127.0.0.1"
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: "moneyprintergobrrr"
      I2P_HOST: "127.0.0.1"
      I2P_SAM_PORT: "7656"
      BITCOIND_IP: "${APP_CONTAINERS_BITCOIN_SIGNET_NODE_IP}"
      RPC_USER: "${APP_CONTAINERS_BITCOIN_SIGNET_RPC_USER}"
      RPC_PASS: "${APP_CONTAINERS_BITCOIN_SIGNET_RPC_PASS}"
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      P2P_HIDDEN_SERVICE: ""
      RPC_HIDDEN_SERVICE: ""
    networks:
      default:
        ipv4_address: $APP_CONTAINERS_BITCOIN_SIGNET_NODE_IP
